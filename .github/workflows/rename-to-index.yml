name: Rename website file to index.html

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rename-to-index.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename white-compass-website.html to index.html
        run: |
          if [ -f index.html ]; then
            echo "index.html already exists, nothing to do"
            exit 0
          fi
          if [ ! -f white-compass-website.html ]; then
            echo "source file not found"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv white-compass-website.html index.html
          git commit -m "Rename white-compass-website.html to index.html"
          git push
