name: Temp Publish White Compass

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Replace index.html and remove uploaded copy
        run: |
          cp white-compass-website.html index.html
          rm white-compass-website.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A
          git status --short
          git commit -m "Publish new White Compass website" || echo "No changes to commit"
          git push
